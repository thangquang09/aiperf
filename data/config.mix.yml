# Multi-turn chat + long-context RAG + agentic mix (token-weighted by source pool size).
#
# chat uses sharegpt_multiturn: preserves full conversation (mean 3.5 turns).
# Full pool sizes (measured):
#   sharegpt_multiturn: 86,740 sessions, 302,403 requests, 16.33M input tokens
#   longrag_nq:           100 sessions,      100 requests,  ~2.0M input tokens (avg ~20K ISL)
#   weka (per trace):  ~1.2M input tokens, ~13 turns each (synthesized)
#
# Tune `num_traces` to scale weka. With num_traces=4, agentic is ~21% of
# pool tokens but only 19/86K sessions => use --max-chat-sessions to cap
# chat so agentic gets sampled in short benchmark runs.
#
# ISL tiers: chat ~200 tok (light), longrag ~20K tok (mid), weka ~273K tok (heavy).

tokenizer: builtin
sources:
  chat:
    loader: sharegpt_multiturn
    chat_delay_ms: [500, 3000]
    max_sessions: 500
  rag:
    loader: longrag_nq
    chat_delay_ms: [500, 3000]
  agentic:
    loader: semianalysis_cc_traces_weka_062126_256k
    num_traces: 4
out_file: data/merged_workload.dag.jsonl
